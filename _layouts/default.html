<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page.title | default: site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/docs.css' | relative_url }}" />
  </head>
  <body>
    <div class="docs-shell">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <a href="{{ '/' | relative_url }}">DSA-LeetCode</a>
        </div>

        <nav aria-label="Sidebar navigation">
          <details open>
            <summary>Intervals</summary>
            <ul>
              {% assign interval_pages = site.pages | where_exp: 'p', 'p.url contains "/Intervals/"' | sort: 'url' %}
              {% for p in interval_pages %}
                {% unless p.url == '/' %}
                  <li>
                    <a href="{{ p.url | relative_url }}">{{ p.title | default: p.name }}</a>
                  </li>
                {% endunless %}
              {% endfor %}
            </ul>
          </details>
        </nav>
      </aside>

      <main class="content">
        <button class="nav-toggle" type="button" aria-label="Toggle navigation">
          ☰
        </button>

        <article class="markdown-body">
          {{ content }}
        </article>
      </main>
    </div>

    <script>
      const toggleBtn = document.querySelector('.nav-toggle');
      const sidebar = document.getElementById('sidebar');

      toggleBtn?.addEventListener('click', () => {
        sidebar.classList.toggle('collapsed');
      });
    </script>
  </body>
</html>
